name: Application checks
on:
  push:
  pull_request:
  # Каждый понедельник в 07:23 по Москве: новые уязвимости в зависимостях всплывают заранее, а не в день выкладки.
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm audit --audit-level=moderate
