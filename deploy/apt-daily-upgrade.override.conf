# Ночной запуск автообновлений безопасности Ubuntu.
# Ставится в /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf (это делает install.sh).
# По умолчанию таймер срабатывает в 06:00-07:00 по времени сервера (UTC), то есть в 09:00-10:00 МСК.
# Здесь 01:00-01:30 UTC = 04:00-04:30 МСК, до ежедневной копии базы в 03:00 UTC.
[Timer]
OnCalendar=
OnCalendar=*-*-* 01:00
RandomizedDelaySec=30m
